[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "schwab-local-cli"
version = "0.1.0"
description = "Local command-line client for the Charles Schwab Trader API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "requests>=2.32,<3",
]

[project.scripts]
schwab = "schwab_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_cli"]

dependencies = [
    "requests>=2.32,<3",
]